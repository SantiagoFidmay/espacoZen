<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço Zen</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="water-canvas"></div>
    
    <header class="top-nav">
        <div class="brand">espaço<span>zen</span></div>
        <div class="stats">
            <span id="stat-streak">0 🔥</span>
            <span class="stat-divider">|</span>
            <span id="stat-minutes">0 min</span>
            <span class="stat-divider">|</span>
            <span id="stat-completed">0 sessões</span>
        </div>
    </header>

    <main class="zen-canvas">
        <!-- SETUP VIEW -->
        <section id="setup-view" class="view">
            <div class="hero">
                <p id="zen-greeting" class="greeting">Bom dia.</p>
                <h1 id="zen-quote" class="quote">O silêncio não é vazio, ele está cheio de respostas.</h1>
            </div>

            <!-- NOVAS FUNÇÕES: Intenção e Ritmo de Respiração -->
            <div class="setup-extras">
                <input type="text" id="intention-input" class="intention-input" placeholder="Qual a sua intenção para hoje?" autocomplete="off" maxlength="25">
                
                <div class="breath-mode-selector">
                    <span class="mode-label">Respiração:</span>
                    <button class="mode-btn active" data-mode="classic" aria-label="Inspirar 4s, Reter 4s, Expirar 4s">Clássica</button>
                    <button class="mode-btn" data-mode="relax" aria-label="Inspirar 4s, Reter 7s, Expirar 8s">Relaxamento</button>
                    <button class="mode-btn" data-mode="box" aria-label="Box Breathing 4-4-4-4">Foco</button>
                </div>
            </div>

            <div class="controls-bottom">
                <div class="time-picker">
                    <button class="time-btn" data-time="120">2m</button>
                    <button class="time-btn active" data-time="300">5m</button>
                    <button class="time-btn" data-time="600">10m</button>
                    <button class="time-btn" data-time="900">15m</button>
                </div>
                
                <button id="btn-start" class="btn-start">Iniciar Prática</button>
            </div>
        </section>

        <!-- SESSION VIEW -->
        <section id="session-view" class="view hidden">
            <!-- Marca d'água da Intenção -->
            <div id="session-intention" class="session-intention-watermark" aria-hidden="true"></div>

            <div class="ripple-wrapper">
                <div id="ripple-circle" class="ripple-circle"></div>
                <div class="ripple-center">
                    <div id="timer-display" class="timer-display">05:00</div>
                    <div id="breath-text" class="breath-text">Inspirar</div>
                </div>
            </div>

            <div class="controls-bottom session-actions">
                <button id="btn-pause" class="btn-text">Pausar</button>
                <button id="btn-end" class="btn-text btn-text-danger">Encerrar</button>
            </div>
        </section>
    </main>

    <!-- SOUND DRAWER -->
    <button id="btn-sound-toggle" class="sound-toggle" aria-label="Sons de fundo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1" stroke-linecap="round"/></svg>
    </button>
    
    <aside id="sound-drawer" class="sound-drawer">
        <div class="drawer-header">
            <h3>Sons da Natureza</h3>
            <button id="btn-sound-close" class="btn-close">✕</button>
        </div>
        <div class="sound-list">
            <button id="btn-sound-1" class="sound-item">
                <span>Chuva Suave</span>
                <div class="eq-bars"><span></span><span></span><span></span></div>
            </button>
            <button id="btn-sound-2" class="sound-item">
                <span>Ondas do Mar</span>
                <div class="eq-bars"><span></span><span></span><span></span></div>
            </button>
            <button id="btn-sound-3" class="sound-item">
                <span>Floresta Vazia</span>
                <div class="eq-bars"><span></span><span></span><span></span></div>
            </button>
        </div>
        <div class="volume-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <input type="range" id="volume-slider" min="0" max="100" value="50">
        </div>
    </aside>

    <!-- COMPLETION MODAL -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-icon">🌿</div>
            <h2 class="modal-title">Prática Concluída</h2>
            <p id="modal-message" class="modal-desc">Você retornou ao momento presente.</p>
            <button id="modal-close-btn" class="btn-start">Retornar</button>
        </div>
    </div>

    <script src="java.js" defer></script>
</body>
</html>
