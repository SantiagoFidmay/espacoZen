<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço Zen - Meditação Profissional</title>
    <link rel="stylesheet" href="style.css">
    <script src="./java.js"defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Elementos de iluminação ambiental no fundo -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="zen-container">
        <!-- CABEÇALHO -->
        <header>
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"/><path d="M12 6a6 6 0 0 1 6 6c0 3.314-2.686 6-6 6s-6-2.686-6-6 2.686-6 6-6z"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <h1>Espaço Zen</h1>
            <p id="zen-quote">"O silêncio não é vazio, ele está cheio de respostas."</p>
        </header>

        <!-- CONFIGURAÇÃO DA SESSÃO -->
        <section class="setup-section" id="setup-area">
            <div class="section-title">Tempo de Prática</div>
            <div class="time-options">
                <button class="time-btn" data-time="120">
                    <span class="btn-time-num">2</span>
                    <span class="btn-time-unit">min</span>
                </button>
                <button class="time-btn active" data-time="300">
                    <span class="btn-time-num">5</span>
                    <span class="btn-time-unit">min</span>
                </button>
                <button class="time-btn" data-time="600">
                    <span class="btn-time-num">10</span>
                    <span class="btn-time-unit">min</span>
                </button>
            </div>
            
            <button id="btn-start-session" class="btn-primary">Iniciar Jornada</button>

            <!-- Estatísticas -->
            <div class="stats-footer">
                <div class="stat-box">
                    <span class="stat-val" id="stat-completed">0</span>
                    <span class="stat-lbl">Sessões</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-box">
                    <span class="stat-val" id="stat-minutes">0m</span>
                    <span class="stat-lbl">Tempo Total</span>
                </div>
            </div>
        </section>

        <!-- SESSÃO EM ANDAMENTO (OCULTA NO INÍCIO) -->
        <main class="active-session hidden" id="session-area">
            <div class="timer-wrapper">
                <div class="timer-display" id="timer-display">05:00</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <!-- Guia de Respiração -->
            <div class="circle-container">
                <div class="breathing-circle-outer"></div>
                <div class="breathing-circle" id="breath-circle"></div>
                <div class="breath-text-container">
                    <span id="breath-text">Inspirar</span>
                </div>
            </div>

            <!-- Controles -->
            <div class="session-controls">
                <button id="btn-pause-play" class="btn-secondary">Pausar</button>
                <button id="btn-end-early" class="btn-danger">Encerrar</button>
            </div>
        </main>

        <!-- SONS DE AMBIENTE -->
        <section class="sound-section">
            <div class="section-title">Sons de Fundo</div>
            <div class="sound-controls">
                <button id="btn-sound-1" class="sound-btn">
                    <svg class="sound-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><path d="M8 16v4"/><path d="M12 16v6"/><path d="M16 16v4"/></svg>
                    <span class="sound-name">Chuva</span>
                </button>
                <button id="btn-sound-2" class="sound-btn">
                    <svg class="sound-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10c3-3 4.5-3 7.5 0s4.5 3 7.5 0 4.5-3 7.5 0"/><path d="M2 14c3-3 4.5-3 7.5 0s4.5 3 7.5 0 4.5-3 7.5 0"/><path d="M2 18c3-3 4.5-3 7.5 0s4.5 3 7.5 0s4.5-3 7.5 0"/></svg>
                    <span class="sound-name">Ondas</span>
                </button>
                <button id="btn-sound-3" class="sound-btn">
                    <svg class="sound-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-1.5"/><path d="M14 17.5 12.5 16"/><path d="m10 21.5-1.5-1.5"/><path d="M15 5c0 3-2.2 5.5-5 6v1h2v2h2v3.5l1 1"/><path d="M9 12c-2.8-.5-5-3-5-6a5 5 0 0 1 10 0"/></svg>
                    <span class="sound-name">Floresta</span>
                </button>
            </div>
        </section>

        <!-- CRÉDITOS DOS INTEGRANTES -->
        <footer class="credits-footer">
            <span>Desenvolvido por:</span>
            <div class="names-list">Bernardo • Enzo • Matheus • Santiago</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
